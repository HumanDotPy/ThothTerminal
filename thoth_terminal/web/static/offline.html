<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thoth Terminal · Offline</title>
    <style>
      body{
        margin:0;
        font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
        background:#070a0d;
        color:#e6edf3;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:100vh;
      }
      .card{
        border:1px solid #243040;
        background:#0d1117;
        border-radius:14px;
        padding:20px 22px;
        max-width:360px;
        text-align:center;
      }
      .card h1{font-size:18px;margin:0 0 8px;}
      .card p{margin:0;font-size:13px;color:#98a2b3;}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Reconnect to load the latest Thoth timeline and notes.</p>
    </div>
  </body>
</html>
